<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body {
            background-color: rgb(83, 194, 19);
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: rgb(160, 20, 20);
            text-align: center;
        }

        div > p {
            display: none;
        }

        div:hover > p {
            display: block;
            color: white;
            background-color: brown;
            width: 160px;
        }

        div:hover {
            color: brown
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abixo</p>
    <div>Passe o mouse aqui
        <P>TEXTO  ESCONDIDO!</P>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
